repo:
  url: https://github.com/YOU/opi-k8s.git   # overridden by the root Application parameters set from Tofu
  revision: main

# Toggles. Tailscale needs the operator-oauth Secret created by Tofu first.
tailscale:
  enabled: true
# Custom domain for the UIs (https://grafana.<domain> etc.) over the tailnet: Traefik gets a tailnet LoadBalancer
# (gitops/traefik), cert-manager issues Let's Encrypt certs via Cloudflare DNS-01 (needs the cloudflare-api-token
# Secret: fill cloudflare_api_token in tfvars, `make argocd`). Empty = off. The literal hostnames live in each app's values.
domain: h.mico.ie
# Immich (photos) + its Postgres operator (CloudNativePG). Needs `domain` for the ingress.
immich:
  enabled: true
# Set monitoring.enabled=false during disaster recovery until volumes are restored (see README → Recreate from backup).
monitoring:
  enabled: true
# Renovate needs the renovate-token Secret first: fill renovate_github_token in tfvars, `make argocd`, then flip this.
renovate:
  enabled: true
