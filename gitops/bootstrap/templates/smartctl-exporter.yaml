{{- if .Values.monitoring.enabled }}
# NVMe SMART + temperature per node (privileged DaemonSet, ns monitoring is PSA privileged)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: smartctl-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus-smartctl-exporter
      targetRevision: 0.17.1
      helm:
        releaseName: smartctl
        valueFiles:
          - $values/gitops/smartctl-exporter/values.yaml
    - repoURL: "{{ .Values.repo.url }}"
      targetRevision: "{{ .Values.repo.revision }}"
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  {{- include "bootstrap.syncPolicy" . | nindent 2 }}
{{- end }}
