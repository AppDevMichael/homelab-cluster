{{- if .Values.renovate.enabled }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: renovate
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://docs.renovatebot.com/helm-charts
      chart: renovate
      targetRevision: 46.300.2
      helm:
        releaseName: renovate
        valueFiles:
          - $values/gitops/renovate/values.yaml
    - repoURL: "{{ .Values.repo.url }}"
      targetRevision: "{{ .Values.repo.revision }}"
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: renovate
  {{- include "bootstrap.syncPolicy" . | nindent 2 }}
{{- end }}
