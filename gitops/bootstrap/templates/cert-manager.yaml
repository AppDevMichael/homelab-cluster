{{- if .Values.domain }}
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://charts.jetstack.io
      chart: cert-manager
      targetRevision: v1.21.2
      helm:
        releaseName: cert-manager
        valueFiles:
          - $values/gitops/cert-manager/values.yaml
    - repoURL: "{{ .Values.repo.url }}"
      targetRevision: "{{ .Values.repo.revision }}"
      ref: values
    # ClusterIssuer (Let's Encrypt, Cloudflare DNS-01)
    - repoURL: "{{ .Values.repo.url }}"
      targetRevision: "{{ .Values.repo.revision }}"
      path: gitops/cert-manager/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  # cainjector writes the CA into the webhook; not drift.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      jqPathExpressions: [".webhooks[].clientConfig.caBundle"]
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions: [".webhooks[].clientConfig.caBundle"]
  {{- include "bootstrap.syncPolicy" . | nindent 2 }}
{{- end }}
