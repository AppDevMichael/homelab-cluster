# kube-prometheus-stack values — sized for three arm64 SBCs. Everything is multi-arch.
# Edit the node IPs + Grafana host below to match your LAN.

fullnameOverride: kps

crds:
  upgradeJob:
    enabled: true        # keeps CRDs current on chart bumps (Helm won't upgrade CRDs by itself)

grafana:
  enabled: true
  replicas: 0   # MAINTENANCE: revert
  admin:
    existingSecret: grafana-admin     # created by Tofu, never in git
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsTimezone: browser
  # Light monitoring parts live on the quorum-only node; Prometheus (1.7 GB) does not fit there next to etcd.
  tolerations: &quorumTol
    - { key: node-role.kubernetes.io/quorum-only, operator: Exists, effect: NoSchedule }
  affinity: &quorumAff  # prefer the quorum-only node (opi4p-3, 4 GB, otherwise idle); falls back to a data node if it is down
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - { key: node-role.kubernetes.io/quorum-only, operator: In, values: ["true"] }
  grafana.ini:
    server:
      root_url: https://grafana.h.mico.ie
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: tailnet   # tailnet-only (gitops/traefik)
      traefik.ingress.kubernetes.io/router.tls: "true"
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - grafana.h.mico.ie
    tls:
      - secretName: grafana-tls
        hosts: [grafana.h.mico.ie]
  persistence:
    enabled: true
    size: 2Gi
    storageClassName: longhorn-encrypted
  deploymentStrategy:
    type: Recreate         # RWO volume: don't try to run old+new pod at once during rollouts
  resources:
    requests: { cpu: 50m, memory: 768Mi }
    limits:   { memory: 768Mi }    # the chart sets GOMEMLIMIT = this limit, so it also caps Go GC slack (heap in use ~100Mi;
                                   # RSS was 400-850Mi at 1536Mi). 256Mi was OOM-killed once dashboards grew.
  grafana.ini:
    analytics: { check_for_updates: false, reporting_enabled: false }
    users: { default_theme: dark }
    dashboards: { default_home_dashboard_path: /tmp/dashboards/home.json }   # manifests/home-dashboard.yaml (sidecar)
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: community
          orgId: 1
          folder: Community
          type: file
          disableDeletion: false
          options:
            path: /var/lib/grafana/dashboards/community
  dashboards:
    community:
      k8s-views-global:   { gnetId: 15757, revision: 43, datasource: Prometheus }
      k8s-views-nodes:    { gnetId: 15759, revision: 37, datasource: Prometheus }
      node-exporter-full: { gnetId: 1860,  revision: 37, datasource: Prometheus }
      # per-app dashboards (upstream-published); Immich has none upstream -> the Home dashboard carries its row
      longhorn:           { gnetId: 13032, revision: 6,  datasource: Prometheus }
      argocd:             { gnetId: 14584, revision: 1,  datasource: Prometheus }
      traefik:            { gnetId: 17346, revision: 9,  datasource: Prometheus }
      cert-manager:       { gnetId: 20842, revision: 3,  datasource: Prometheus }
      cloudnativepg:      { gnetId: 20417, revision: 4,  datasource: Prometheus }

prometheus:
  ingress:               # no auth of its own: tailnet-only, like Longhorn
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: tailnet
      traefik.ingress.kubernetes.io/router.tls: "true"
      cert-manager.io/cluster-issuer: letsencrypt
    hosts: [prometheus.h.mico.ie]
    tls:
      - secretName: prometheus-tls
        hosts: [prometheus.h.mico.ie]
  prometheusSpec:
    replicas: 0   # MAINTENANCE: revert
    externalUrl: https://prometheus.h.mico.ie      # links in alert mails
    retention: 30d
    retentionSize: 15GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 400m, memory: 2Gi }
      limits:   { memory: 4Gi }   # was at 863Mi of 1Gi after 4h; nodes have 12 GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-encrypted
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 20Gi } }

alertmanager:
  enabled: true
  # E-mail via the owner's Stalwart server. Password: Secret alertmanager-smtp (Tofu, smtp_password), mounted below.
  config:
    global:
      smtp_smarthost: mail.mico.ie:465          # implicit TLS (Alertmanager switches to SMTPS on 465)
      smtp_from: alerts@mico.ie
      smtp_auth_username: alerts@mico.ie
      smtp_auth_password_file: /etc/alertmanager/secrets/alertmanager-smtp/password
      smtp_require_tls: true
    route:
      receiver: email
      group_by: [alertname, namespace]
      group_wait: 1m
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: healthchecks                  # Watchdog always fires: its notifications are the dead man's switch ping
          matchers: [alertname = Watchdog]
          group_wait: 0s
          repeat_interval: 4m                     # healthchecks.io check: period 10 min, grace 5 min
        - receiver: "null"
          matchers: [alertname = InfoInhibitor]
    receivers:
      - name: "null"
      - name: email
        email_configs:
          - to: me@mico.ie
            send_resolved: true
      - name: healthchecks
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-healthchecks/url
            send_resolved: false
    inhibit_rules:
      - source_matchers: [severity = critical]  # a critical silences the same warning
        target_matchers: [severity = warning]
        equal: [namespace, alertname]
  ingress:               # no auth of its own: tailnet-only, like Longhorn
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: tailnet
      traefik.ingress.kubernetes.io/router.tls: "true"
      cert-manager.io/cluster-issuer: letsencrypt
    hosts: [alertmanager.h.mico.ie]
    tls:
      - secretName: alertmanager-tls
        hosts: [alertmanager.h.mico.ie]
  alertmanagerSpec:
    replicas: 0   # MAINTENANCE: revert
    externalUrl: https://alertmanager.h.mico.ie
    secrets: [alertmanager-smtp, alertmanager-healthchecks]   # mounted at /etc/alertmanager/secrets/<name>/
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-encrypted
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 1Gi } }
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits:   { memory: 128Mi }
    tolerations: *quorumTol
    affinity: *quorumAff   # see grafana

prometheus-node-exporter:
  tolerations:            # opi4p-3 is tainted quorum-only; still export its metrics
  - { key: node-role.kubernetes.io/quorum-only, operator: Exists, effect: NoSchedule }
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits:   { memory: 64Mi }
  extraArgs:
    - --collector.hwmon
    - --collector.thermal_zone
kube-state-metrics:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits:   { memory: 128Mi }
  tolerations: *quorumTol
  affinity: *quorumAff   # see grafana
prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 256Mi }
  tolerations: *quorumTol
  affinity: *quorumAff   # see grafana

# k3s control plane. Only etcd is scraped: scheduler, controller-manager and kube-proxy live in the k3s process and
# each metrics port serves the SAME ~190k-series registry (3x duplicate; they cannot be down without the apiserver).
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeProxy: { enabled: false }
kubeEtcd:
  enabled: true
  endpoints: [192.168.69.101, 192.168.69.102, 192.168.69.103]
  service: { port: 2381, targetPort: 2381 }

