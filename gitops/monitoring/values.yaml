# kube-prometheus-stack values — sized for three arm64 SBCs. Everything is multi-arch.
# Edit the node IPs + Grafana host below to match your LAN.

fullnameOverride: kps

crds:
  upgradeJob:
    enabled: true        # keeps CRDs current on chart bumps (Helm won't upgrade CRDs by itself)

grafana:
  enabled: true
  admin:
    existingSecret: grafana-admin     # created by Tofu, never in git
    userKey: admin-user
    passwordKey: admin-password
  defaultDashboardsTimezone: browser
  env:
    GOMEMLIMIT: 400MiB     # Go keeps ~5x heap as idle slack otherwise (heap in use ~100Mi, RSS was 400-850Mi)
  # Light monitoring parts live on the quorum-only node; Prometheus (1.7 GB) does not fit there next to etcd.
  tolerations:
    - { key: node-role.kubernetes.io/quorum-only, operator: Exists, effect: NoSchedule }
  affinity:             # prefer the quorum-only node (opi4p-3, 4 GB, otherwise idle); falls back to a data node if it is down
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - { key: node-role.kubernetes.io/quorum-only, operator: In, values: ["true"] }
  grafana.ini:
    server:
      root_url: https://grafana.h.mico.ie
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: tailnet   # tailnet-only (gitops/traefik)
      traefik.ingress.kubernetes.io/router.tls: "true"
      cert-manager.io/cluster-issuer: letsencrypt
    hosts:
      - grafana.h.mico.ie
    tls:
      - secretName: grafana-tls
        hosts: [grafana.h.mico.ie]
  persistence:
    enabled: true
    size: 2Gi
    storageClassName: longhorn-encrypted
  deploymentStrategy:
    type: Recreate         # RWO volume: don't try to run old+new pod at once during rollouts
  resources:
    requests: { cpu: 50m, memory: 768Mi }
    limits:   { memory: 1536Mi }   # Grafana 13 + Longhorn/k8s dashboards sat at 239Mi and got OOM-killed at 256Mi
  grafana.ini:
    analytics: { check_for_updates: false, reporting_enabled: false }
    users: { default_theme: dark }
    dashboards: { default_home_dashboard_path: /tmp/dashboards/home.json }   # manifests/home-dashboard.yaml (sidecar)
  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: community
          orgId: 1
          folder: Community
          type: file
          disableDeletion: false
          options:
            path: /var/lib/grafana/dashboards/community
  dashboards:
    community:
      k8s-views-global:   { gnetId: 15757, revision: 43, datasource: Prometheus }
      k8s-views-nodes:    { gnetId: 15759, revision: 37, datasource: Prometheus }
      node-exporter-full: { gnetId: 1860,  revision: 37, datasource: Prometheus }
      # per-app dashboards (upstream-published); Immich has none upstream -> the Home dashboard carries its row
      longhorn:           { gnetId: 13032, revision: 6,  datasource: Prometheus }
      argocd:             { gnetId: 14584, revision: 1,  datasource: Prometheus }
      traefik:            { gnetId: 17346, revision: 9,  datasource: Prometheus }
      cert-manager:       { gnetId: 20842, revision: 3,  datasource: Prometheus }
      cloudnativepg:      { gnetId: 20417, revision: 4,  datasource: Prometheus }

prometheus:
  prometheusSpec:
    retention: 30d
    retentionSize: 15GB
    scrapeInterval: 30s
    evaluationInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests: { cpu: 400m, memory: 2Gi }
      limits:   { memory: 4Gi }   # was at 863Mi of 1Gi after 4h; nodes have 12 GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-encrypted
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 20Gi } }

alertmanager:
  enabled: true
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: longhorn-encrypted
          accessModes: [ReadWriteOnce]
          resources: { requests: { storage: 1Gi } }
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits:   { memory: 128Mi }
    tolerations:
      - { key: node-role.kubernetes.io/quorum-only, operator: Exists, effect: NoSchedule }
    affinity:             # prefer the quorum-only node (see grafana.affinity)
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - { key: node-role.kubernetes.io/quorum-only, operator: In, values: ["true"] }

prometheus-node-exporter:
  tolerations:            # opi4p-3 is tainted quorum-only; still export its metrics
  - { key: node-role.kubernetes.io/quorum-only, operator: Exists, effect: NoSchedule }
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits:   { memory: 64Mi }
  extraArgs:
    - --collector.hwmon
    - --collector.thermal_zone
kube-state-metrics:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits:   { memory: 128Mi }
  tolerations:
    - { key: node-role.kubernetes.io/quorum-only, operator: Exists, effect: NoSchedule }
  affinity:             # prefer the quorum-only node (see grafana.affinity)
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - { key: node-role.kubernetes.io/quorum-only, operator: In, values: ["true"] }
prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 256Mi }
  tolerations:
    - { key: node-role.kubernetes.io/quorum-only, operator: Exists, effect: NoSchedule }
  affinity:             # prefer the quorum-only node (see grafana.affinity)
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - { key: node-role.kubernetes.io/quorum-only, operator: In, values: ["true"] }

# k3s control plane — all three nodes are servers. Ansible sets bind-address=0.0.0.0 for these.
kubeControllerManager:
  enabled: true
  endpoints: &nodes [192.168.69.101, 192.168.69.102, 192.168.69.103]   # <- change
  service: { port: 10257, targetPort: 10257 }
  serviceMonitor: { https: true, insecureSkipVerify: true }
kubeScheduler:
  enabled: true
  endpoints: *nodes
  service: { port: 10259, targetPort: 10259 }
  serviceMonitor: { https: true, insecureSkipVerify: true }
kubeProxy:
  enabled: true
  endpoints: *nodes
kubeEtcd:
  enabled: true
  endpoints: *nodes
  service: { port: 2381, targetPort: 2381 }

