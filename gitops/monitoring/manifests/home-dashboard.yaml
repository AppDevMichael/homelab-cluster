# Landing page: one row per app (pods, restarts, memory, CPU, volume %) + cluster health strip. Loaded by the Grafana
# sidecar (label grafana_dashboard) and set as default_home_dashboard_path in values.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-home
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  home.json: |
    {
     "title": "Home",
     "uid": "home",
     "tags": [
      "home"
     ],
     "timezone": "browser",
     "schemaVersion": 39,
     "version": 1,
     "refresh": "1m",
     "time": {
      "from": "now-6h",
      "to": "now"
     },
     "templating": {
      "list": [
       {
        "name": "ds",
        "type": "datasource",
        "query": "prometheus",
        "current": {
         "text": "Prometheus",
         "value": "Prometheus"
        },
        "hide": 2
       }
      ]
     },
     "panels": [
      {
       "type": "row",
       "title": "Cluster",
       "collapsed": false,
       "gridPos": {
        "x": 0,
        "y": 0,
        "w": 24,
        "h": 1
       },
       "panels": []
      },
      {
       "type": "stat",
       "title": "Nodes NotReady",
       "datasource": {
        "type": "prometheus",
        "uid": "${ds}"
       },
       "gridPos": {
        "x": 0,
        "y": 1,
        "w": 4,
        "h": 3
       },
       "targets": [
        {
         "expr": "count(kube_node_status_condition{condition=\"Ready\",status=\"true\"}==0) or vector(0)",
         "legendFormat": "",
         "instant": true,
         "refId": "A"
        }
       ],
       "options": {
        "reduceOptions": {
         "calcs": [
          "lastNotNull"
         ],
         "fields": "",
         "values": false
        },
        "colorMode": "value",
        "graphMode": "none",
        "textMode": "value"
       },
       "fieldConfig": {
        "defaults": {
         "unit": "none",
         "thresholds": {
          "mode": "absolute",
          "steps": [
           {
            "color": "green",
            "value": null
           },
           {
            "color": "red",
            "value": 1
           }
          ]
         }
        },
        "overrides": []
       }
      },
      {
       "type": "stat",
