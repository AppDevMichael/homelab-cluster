# Extra alerts that matter on small boards. Picked up by Prometheus via ruleSelectorNilUsesHelmValues=false.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sbc-alerts
  namespace: monitoring
spec:
  groups:
    - name: sbc
      rules:
        - alert: SoCTemperatureHigh
          expr: max by (instance) (node_thermal_zone_temp) > 80
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.instance }} SoC at {{ $value | printf \"%.0f\" }}°C"
        - alert: SoCTemperatureCritical
          expr: max by (instance) (node_thermal_zone_temp) > 90
          for: 2m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.instance }} SoC at {{ $value | printf \"%.0f\" }}°C — throttling likely"
        - alert: RootFilesystemNearlyFull
          expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.10
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.instance }} root filesystem under 10% free"
        - alert: NodeMemoryPressure
          expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.10
          for: 5m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.instance }} has <10% memory available"
    - name: backups
      rules:
        - alert: LonghornVolumeDegraded
          expr: longhorn_volume_robustness == 2
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} is degraded (a replica is missing)"
        - alert: LonghornBackupTargetUnavailable
          expr: longhorn_backup_target_available == 0
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "Longhorn can't reach the backup target (Storage Box)"
        - alert: LonghornVolumeNoRecentBackup
          expr: (time() - longhorn_volume_last_backup_timestamp) > 60*60*36 unless on (volume) longhorn_volume_last_backup_timestamp == 0
          for: 1h
          labels: { severity: warning }
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} has no backup in 36h"
    - name: argocd
      rules:
        - alert: ArgoCDAppNotSynced
          expr: argocd_app_info{sync_status!="Synced"} == 1
          for: 30m
          labels: { severity: warning }
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is {{ $labels.sync_status }} for 30m (https://argocd.h.mico.ie)"
        - alert: ArgoCDAppUnhealthy
          expr: argocd_app_info{health_status!~"Healthy|Progressing"} == 1
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "ArgoCD app {{ $labels.name }} is {{ $labels.health_status }} for 15m (https://argocd.h.mico.ie)"
    - name: smart
      rules:
        - alert: NVMeSmartFailed
          expr: smartctl_device_smart_status != 1
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.node }}: NVMe SMART overall status FAILED"
        - alert: NVMeCriticalWarning
          expr: smartctl_device_critical_warning != 0 or smartctl_device_media_errors > 0
          for: 5m
          labels: { severity: critical }
          annotations:
            summary: "{{ $labels.node }}: NVMe reports a critical warning or media errors"
        - alert: NVMeSpareLow
          expr: smartctl_device_available_spare < smartctl_device_available_spare_threshold
          for: 15m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.node }}: NVMe available spare below its threshold"
        - alert: NVMeTemperatureHigh
          expr: smartctl_device_temperature{temperature_type="current"} > 65
          for: 10m
          labels: { severity: warning }
          annotations:
            summary: "{{ $labels.node }}: NVMe at {{ $value | printf \"%.0f\" }}°C"
