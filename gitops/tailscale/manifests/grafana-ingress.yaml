# https://grafana.<tailnet>.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-tailscale
  namespace: monitoring
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: kps-grafana
      port: { number: 80 }
  tls:
    - hosts: [grafana]
---
# https://argocd.<tailnet>.ts.net
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-tailscale
  namespace: argocd
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: argocd-server
      port: { number: 80 }
  tls:
    - hosts: [argocd]
---
# https://longhorn.<tailnet>.ts.net — the UI has no auth of its own; tailnet ACLs are the auth.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: longhorn-tailscale
  namespace: longhorn-system
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: longhorn-frontend
      port: { number: 80 }
  tls:
    - hosts: [longhorn]
