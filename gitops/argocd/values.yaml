# argo/argo-cd values — sized for three arm64 SBCs.
global:
  domain: argocd.192.168.69.101.nip.io      # <- change to a node IP or a real hostname

configs:
  params:
    server.insecure: true                  # TLS terminated by Traefik / Tailscale
    controller.diff.server.side: "true"
  cm:
    timeout.reconciliation: 180s
    resource.customizations.ignoreDifferences.all: |
      managedFieldsManagers:
        - kube-controller-manager

repoServer:
  metrics: { enabled: true, serviceMonitor: { enabled: true } }
server:
  metrics: { enabled: true, serviceMonitor: { enabled: true } }
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.h.mico.ie
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: tailnet   # tailnet-only (gitops/traefik)
      traefik.ingress.kubernetes.io/router.tls: "true"
      cert-manager.io/cluster-issuer: letsencrypt
    tls: true            # secret argocd-server-tls, filled by cert-manager
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 256Mi }

controller:
  metrics: { enabled: true, serviceMonitor: { enabled: true } }
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { memory: 1Gi }

repoServer:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 512Mi }

applicationSet:
  replicas: 0           # not used (chart 10 has no enabled toggle; 0 replicas = no pod, saves ~100Mi)
dex:
  enabled: false        # local admin login only; enable for SSO
notifications:
  enabled: false

redis:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits:   { memory: 128Mi }
