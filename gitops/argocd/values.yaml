# argo/argo-cd values — sized for three arm64 SBCs.
global:
  domain: argocd.192.168.69.101.nip.io      # <- change to a node IP or a real hostname

configs:
  params:
    server.insecure: true                  # TLS terminated by Traefik / Tailscale
    controller.diff.server.side: "true"
  cm:
    timeout.reconciliation: 180s
    # ArgoCD 3 excludes Endpoints/EndpointSlice by default, which silently drops kube-prometheus-stack's static scrape
    # targets for the k3s control plane (kubeScheduler.endpoints etc.). Same default list without that entry.
    resource.exclusions: |
      - apiGroups: [coordination.k8s.io]
        kinds: [Lease]
      - apiGroups: [authentication.k8s.io, authorization.k8s.io]
        kinds: [SelfSubjectReview, TokenReview, LocalSubjectAccessReview, SelfSubjectAccessReview, SelfSubjectRulesReview, SubjectAccessReview]
      - apiGroups: [certificates.k8s.io]
        kinds: [CertificateSigningRequest]
      - apiGroups: [cert-manager.io]
        kinds: [CertificateRequest]
    resource.customizations.ignoreDifferences.all: |
      managedFieldsManagers:
        - kube-controller-manager

server:
  metrics: { enabled: true, serviceMonitor: { enabled: true } }
  ingress:
    enabled: true
    ingressClassName: traefik
    hostname: argocd.h.mico.ie
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: tailnet   # tailnet-only (gitops/traefik)
      traefik.ingress.kubernetes.io/router.tls: "true"
      cert-manager.io/cluster-issuer: letsencrypt
    tls: true            # secret argocd-server-tls, filled by cert-manager
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 256Mi }

controller:
  metrics: { enabled: true, serviceMonitor: { enabled: true } }
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits:   { memory: 1Gi }

repoServer:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { memory: 512Mi }
  metrics: { enabled: true, serviceMonitor: { enabled: true } }
  # manifest rendering (helm/kustomize) runs on the quorum-only node, which is otherwise idle
  tolerations:
    - { key: node-role.kubernetes.io/quorum-only, operator: Exists, effect: NoSchedule }
  affinity:             # prefer the quorum-only node (opi4p-3, 4 GB, otherwise idle); falls back to a data node if it is down
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - { key: node-role.kubernetes.io/quorum-only, operator: In, values: ["true"] }

applicationSet:
  replicas: 0           # not used (chart 10 has no enabled toggle; 0 replicas = no pod, saves ~100Mi)
dex:
  enabled: false        # local admin login only; enable for SSO
notifications:
  enabled: false

redis:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits:   { memory: 128Mi }
