# Extra Traefik entrypoint "tailnet" (8444, TLS). It is NOT in the LAN LoadBalancer (expose.default false), only the
# Tailscale LoadBalancer below forwards to it -> Ingresses pinned to this entrypoint are reachable from the tailnet only.
# k3s merges HelmChartConfig into its bundled Traefik chart (one Traefik restart when it first applies).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      tailnet:
        port: 8444
        exposedPort: 8444
        protocol: TCP
        expose:
          default: false
        tls:
          enabled: true
---
# https://<app>.h.mico.ie -> this tailnet IP (Cloudflare A record `*.h.mico.ie`, DNS-only, pointing at the 100.x address
# `kubectl -n kube-system get svc traefik-tailnet` shows). MagicDNS name: h.<tailnet>.ts.net
apiVersion: v1
kind: Service
metadata:
  name: traefik-tailnet
  namespace: kube-system
  annotations:
    tailscale.com/hostname: h
spec:
  type: LoadBalancer
  loadBalancerClass: tailscale
  selector:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/instance: traefik-kube-system
  ports:
    - name: https
      port: 443
      targetPort: 8444
