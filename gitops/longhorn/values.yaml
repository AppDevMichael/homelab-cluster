# longhorn/longhorn values — replicated, encrypted block storage across the three Pis.
# Secrets (longhorn-crypto, longhorn-backup-cifs) are created by Tofu.

preUpgradeChecker:
  jobEnabled: false            # required when installing via ArgoCD (the hook Job breaks the sync)

persistence:
  defaultClass: false          # we ship our own StorageClasses in manifests/ (encrypted one is the default)
  defaultClassReplicaCount: 2

defaultBackupStore:
  backupTarget: cifs://u656965-sub1.your-storagebox.de/backup/opi-k8s/longhorn    # <- change: //<user>.your-storagebox.de/backup is the SMB share
  backupTargetCredentialSecret: longhorn-backup-cifs
  pollInterval: 300

defaultSettings:
  defaultReplicaCount: 2
  defaultDataPath: /var/lib/longhorn
  # Failover: when a node goes NotReady, delete its stateful pods so they reschedule and the volume re-attaches elsewhere.
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  replicaAutoBalance: best-effort
  replicaSoftAntiAffinity: false          # replicas must live on different nodes
  storageMinimalAvailablePercentage: 15
  storageOverProvisioningPercentage: 100
  guaranteedInstanceManagerCPU: 6         # % of node CPU reserved per node; default 12 is a lot on an SBC
  autoSalvage: true
  autoDeletePodWhenVolumeDetachedUnexpectedly: true
  concurrentReplicaRebuildPerNodeLimit: 2
  backupCompressionMethod: lz4
  backupConcurrentLimit: 2
  restoreConcurrentLimit: 2
  snapshotDataIntegrity: fast-check
  orphanResourceAutoDeletion: replica-data
  upgradeChecker: false
  allowCollectingLonghornUsageMetrics: false
  v2DataEngine: false

longhornManager:
  tolerations:
    - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
longhornDriver:
  tolerations:
    - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
longhornUI:
  replicas: 1

metrics:
  serviceMonitor:
    enabled: true              # Longhorn dashboards land in Grafana automatically (sidecar picks up the ConfigMaps)

ingress:
  enabled: false               # UI has no auth: only reachable via the Tailscale Ingress in gitops/tailscale
