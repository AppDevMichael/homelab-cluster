# longhorn/longhorn values — replicated, encrypted block storage across the three Pis.
# Secrets (longhorn-crypto, longhorn-backup-s3) are created by Tofu.

preUpgradeChecker:
  jobEnabled: false            # required when installing via ArgoCD (the hook Job breaks the sync)

persistence:
  defaultClass: false          # we ship our own StorageClasses in manifests/ (encrypted one is the default)
  defaultClassReplicaCount: 2

defaultBackupStore:
  # S3-compatible bucket (Backblaze B2). Format: s3://<bucket>@<region>/<path>/ ; endpoint + keys come from the
  # longhorn-backup-s3 Secret (Tofu). Not the Storage Box: it only does SFTP/SMB and our ISP blocks SMB (445).
  backupTarget: s3://mico-lab@eu-central-003/opi-k8s/longhorn/
  backupTargetCredentialSecret: longhorn-backup-s3
  pollInterval: 300

defaultSettings:
  defaultReplicaCount: 2
  defaultDataPath: /var/lib/longhorn
  # Failover: when a node goes NotReady, delete its stateful pods so they reschedule and the volume re-attaches elsewhere.
  nodeDownPodDeletionPolicy: delete-both-statefulset-and-deployment-pod
  replicaAutoBalance: best-effort
  replicaSoftAntiAffinity: false          # replicas must live on different nodes
  storageMinimalAvailablePercentage: 25
  storageOverProvisioningPercentage: 100
  storageReservedPercentageForDefaultDisk: 200
  guaranteedInstanceManagerCPU: 6         # % of node CPU reserved per node; default 12 is a lot on an SBC
  autoSalvage: true
  autoDeletePodWhenVolumeDetachedUnexpectedly: true
  concurrentReplicaRebuildPerNodeLimit: 2
  backupCompressionMethod: lz4
  backupConcurrentLimit: 2
  restoreConcurrentLimit: 2
  snapshotDataIntegrity: fast-check
  orphanResourceAutoDeletion: replica-data
  upgradeChecker: false
  allowCollectingLonghornUsageMetrics: false
  v2DataEngine: false
  # opi-3 is tainted quorum-only; Longhorn's DaemonSets/CSI still need to run there (node agent), replicas don't
  taintToleration: "node-role.kubernetes.io/quorum-only=true:NoSchedule"

longhornManager:
  tolerations:
    - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
    - { key: node-role.kubernetes.io/quorum-only, operator: Exists, effect: NoSchedule }
longhornDriver:
  tolerations:
    - { key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule }
    - { key: node-role.kubernetes.io/quorum-only, operator: Exists, effect: NoSchedule }
longhornUI:
  replicas: 1

metrics:
  serviceMonitor:
    enabled: true              # Longhorn dashboards land in Grafana automatically (sidecar picks up the ConfigMaps)

ingress:
  enabled: false               # UI has no auth: only reachable via the Tailscale Ingress in gitops/tailscale
