---
# Rolling full OS upgrade (everything apt knows about, incl. Armbian kernel/u-boot).
# One node at a time: drain → apt full-upgrade → reboot if needed → uncordon → wait Ready.
#   cd ansible && ansible-playbook upgrade-os.yml
- name: Rolling OS upgrade
  hosts: k3s_cluster
  serial: 1
  vars:
    kubectl_node: "{{ groups['k3s_init'][0] }}"
  tasks:
    - name: Drain node
      ansible.builtin.command: >
        kubectl drain {{ inventory_hostname }} --ignore-daemonsets --delete-emptydir-data --timeout=300s
      delegate_to: "{{ kubectl_node }}"
      changed_when: true

    - name: apt full-upgrade
      ansible.builtin.apt:
        upgrade: full
        update_cache: true
        autoremove: true
        autoclean: true

    - name: Reboot required?
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_flag

    - name: Reboot
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: reboot_flag.stat.exists

    - name: Wait for k3s
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ ansible_host }}"
        timeout: 300

    - name: Uncordon node
      ansible.builtin.command: kubectl uncordon {{ inventory_hostname }}
      delegate_to: "{{ kubectl_node }}"
      changed_when: true

    - name: Wait until Ready
      ansible.builtin.command: kubectl get node {{ inventory_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      delegate_to: "{{ kubectl_node }}"
      register: ready
      until: ready.stdout == "True"
      retries: 30
      delay: 10
      changed_when: false

    - name: Settle before the next node
      ansible.builtin.pause:
        seconds: 60
