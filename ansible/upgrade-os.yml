---
# Rolling full OS upgrade (everything apt knows about, incl. Armbian kernel/u-boot).
# One node at a time: drain → apt full-upgrade → reboot if needed → uncordon → wait Ready.
#   cd ansible && ansible-playbook upgrade-os.yml
- name: Rolling OS upgrade
  hosts: k3s_cluster
  serial: 1
  tasks:
    - ansible.builtin.include_role: { name: rolling, tasks_from: drain.yml }

    - name: apt full-upgrade
      ansible.builtin.apt:
        upgrade: full
        update_cache: true
        autoremove: true
        autoclean: true

    - name: Reboot required?
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_flag

    - name: Reboot
      ansible.builtin.reboot:
        reboot_timeout: 600
      when: reboot_flag.stat.exists

    - ansible.builtin.include_role: { name: rolling, tasks_from: resume.yml }

    - name: Settle before the next node
      ansible.builtin.pause:
        seconds: 60
      when: inventory_hostname != ansible_play_hosts_all[-1]
