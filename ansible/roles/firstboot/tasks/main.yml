---
# Runs against a freshly flashed Armbian SD card (root / default password "1234", no user, no config).
# Does everything the interactive first-login wizard would, without the wizard.

- name: Disable Armbian's first-login wizard
  ansible.builtin.file:
    path: /root/.not_logged_in_yet
    state: absent

- name: Install our SSH key for root (later plays use key auth; hardening disables root SSH at the end)
  ansible.posix.authorized_key:
    user: root
    key: "{{ item }}"
  loop: "{{ hardening_ssh_pubkeys }}"

# The default root password is public knowledge — replace it now. Saved locally for console recovery.
- name: Generate a root password (kept in ansible/secrets/, git-ignored)
  ansible.builtin.set_fact:
    root_password: "{{ lookup('password', playbook_dir ~ '/secrets/root_password_' ~ inventory_hostname ~ ' length=24 chars=ascii_letters,digits') }}"
  no_log: true

- name: Hash it on the node (no passlib on the control machine; fixed salt so re-runs are no-ops)
  ansible.builtin.command: openssl passwd -6 -salt "{{ (root_password | hash('sha256'))[:16] }}" "{{ root_password }}"
  register: root_hash
  changed_when: false
  no_log: true

- name: Set root password
  ansible.builtin.user:
    name: root
    password: "{{ root_hash.stdout }}"
  no_log: true

- name: Locale
  ansible.builtin.locale_gen:
    name: "{{ firstboot_locale }}"
    state: present

- name: Default locale   # lineinfile, not copy: update-locale rewrites this file with a header
  ansible.builtin.lineinfile:
    path: /etc/default/locale
    regexp: '^LANG='
    line: "LANG={{ firstboot_locale }}"
    create: true
    mode: "0644"

# ---- Static IP (only if the node isn't already on its inventory IP) ----
- name: Current primary interface / address
  ansible.builtin.set_fact:
    fb_iface: "{{ ansible_facts['default_ipv4']['interface'] }}"
    fb_current_ip: "{{ ansible_facts['default_ipv4']['address'] }}"

- name: Configure static IP with netplan
  when:
    - static_ip_enabled
    - fb_current_ip != hostvars[inventory_hostname].ansible_host
  block:
    - name: Move Armbian's DHCP-everything netplan aside
      ansible.builtin.shell: |
        for f in /etc/netplan/*dhcp*.yaml /etc/netplan/armbian-default.yaml; do
          [ -f "$f" ] && mv "$f" "$f.disabled" || true
        done
      changed_when: true

    - name: Write static netplan
      ansible.builtin.template:
        src: netplan-static.yaml.j2
        dest: /etc/netplan/10-static.yaml
        mode: "0600"

    - name: Apply netplan (connection will drop)
      ansible.builtin.shell: sleep 2 && netplan apply
      async: 30
      poll: 0

    - name: Switch to the new address
      ansible.builtin.set_fact:
        ansible_host: "{{ hostvars[inventory_hostname].ansible_host }}"

    - name: Wait for the node on its new IP
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 120

- name: Re-gather facts
  ansible.builtin.setup:
