---
- name: Check whether k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_bin

- name: Create k3s config directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: Install PodSecurity admission config
  ansible.builtin.copy:
    src: psa.yaml
    dest: /etc/rancher/k3s/psa.yaml
    mode: "0600"
  notify: restart k3s

- name: "Install API audit policy (metadata-level - who did what, no request bodies)"
  ansible.builtin.copy:
    src: audit-policy.yaml
    dest: /etc/rancher/k3s/audit-policy.yaml
    mode: "0600"
  notify: restart k3s

# The API cert lists every node's Tailscale IP + MagicDNS name. Gather them here for ALL nodes (delegate_facts), so
# the render is identical whether or not roles/tailscale ran in this invocation — otherwise a partial run drops
# the SANs, "changes" the config and restarts k3s, and the next full run flips it back.
- name: Tailscale identity of every node
  ansible.builtin.command: tailscale status --json
  register: k3s_ts_status
  changed_when: false
  check_mode: false          # read-only; needed for --check renders too
  delegate_to: "{{ item }}"
  loop: "{{ groups['k3s_cluster'] }}"
  run_once: true

- name: Record Tailscale IP + DNS name as facts on each node
  ansible.builtin.set_fact:
    tailscale_ip: "{{ (item.stdout | from_json).Self.TailscaleIPs | select('match', '^100\\.') | first }}"
    tailscale_dns: "{{ (item.stdout | from_json).Self.DNSName | regex_replace('\\.$', '') }}"
  delegate_to: "{{ item.item }}"
  delegate_facts: true
  check_mode: false
  loop: "{{ k3s_ts_status.results }}"
  loop_control:
    label: "{{ item.item }}"
  run_once: true

- name: Render k3s config.yaml
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  notify: restart k3s

- name: Download k3s install script
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/bin/k3s-install.sh
    mode: "0755"

- name: Install k3s server
  ansible.builtin.command: /usr/local/bin/k3s-install.sh server
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  args:
    creates: /usr/local/bin/k3s

- name: Ensure k3s is enabled and running
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Wait for the Kubernetes API
  ansible.builtin.wait_for:
    port: 6443
    host: "{{ ansible_host }}"
    timeout: 300

- name: Wait for this node to be Ready
  ansible.builtin.command: kubectl get node {{ inventory_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: node_ready
  until: node_ready.stdout == "True"
  retries: 30
  delay: 10
  changed_when: false

# k3s ships local-path as the default StorageClass; ours is longhorn-encrypted (gitops/longhorn/manifests). Two defaults
# make PVCs without a storageClassName ambiguous. k3s only re-applies its packaged manifest on upgrades, so re-assert here.
- name: Is local-path still a default StorageClass?
  ansible.builtin.command: >
    k3s kubectl get storageclass local-path
    -o jsonpath='{.metadata.annotations.storageclass\.kubernetes\.io/is-default-class}'
  register: k3s_sc_default
  changed_when: false
  failed_when: false
  when: k3s_role == 'init'

- name: local-path must not be the default StorageClass (longhorn-encrypted is)
  ansible.builtin.command: k3s kubectl annotate storageclass local-path storageclass.kubernetes.io/is-default-class=false --overwrite
  changed_when: true
  when: k3s_role == 'init' and k3s_sc_default.rc == 0 and k3s_sc_default.stdout != 'false'

- name: Quorum-only node holds no Longhorn replicas (no-op until Longhorn exists)
  ansible.builtin.command: >
    k3s kubectl -n longhorn-system patch nodes.longhorn.io {{ inventory_hostname }} --type merge
    -p '{"spec":{"allowScheduling":false,"evictionRequested":true}}'
  register: k3s_lh_node
  changed_when: "'patched' in k3s_lh_node.stdout and 'no change' not in k3s_lh_node.stdout"
  failed_when: k3s_lh_node.rc != 0 and 'not found' not in k3s_lh_node.stderr and 'NotFound' not in k3s_lh_node.stderr
  when: k3s_quorum_only | default(false)
