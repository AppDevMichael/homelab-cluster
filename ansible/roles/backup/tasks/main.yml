---
- name: Assert backup inputs
  ansible.builtin.assert:
    that:
      - backup_key | length >= 32
      - storagebox_user | length > 0
      - storagebox_host | length > 0
    fail_msg: "BACKUP_KEY / STORAGEBOX_USER / STORAGEBOX_HOST must be set (see .env.example, scripts/backup-key.sh)"

# One SSH keypair for the Storage Box, generated on the control machine, shared by all nodes.
- name: Generate Storage Box SSH key (local)
  community.crypto.openssh_keypair:
    path: "{{ playbook_dir }}/secrets/storagebox_ed25519"
    type: ed25519
    comment: "opi-k8s-backup"
  delegate_to: localhost
  become: false
  run_once: true

# `ls` not `true`: the Storage Box restricted shell only knows a few file commands
- name: Does the key already open the Storage Box?
  ansible.builtin.command: "{{ backup_storagebox_ssh_key }} ls"
  delegate_to: localhost
  become: false
  run_once: true
  register: backup_sb_key_ok
  changed_when: false
  failed_when: false

- name: Install the key on the Storage Box (needs STORAGEBOX_PASSWORD; skipped once the key works)
  ansible.builtin.shell: |
    set -e
    # restricted shell on the box: one simple command per ssh call, no chaining.
    # PubkeyAuthentication=no: an agent full of keys would exhaust the box MaxAuthTries before the password is tried.
    sb() {
      sshpass -e ssh -p 23 -o PubkeyAuthentication=no -o PreferredAuthentications=password \
        -o StrictHostKeyChecking=accept-new "{{ storagebox_user }}@{{ storagebox_host }}" "$@"
    }
    sb 'mkdir -p .ssh'
    sb 'cat >> .ssh/authorized_keys' < "{{ playbook_dir }}/secrets/storagebox_ed25519.pub"
  environment:
    SSHPASS: "{{ storagebox_password }}"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: true
  when: backup_sb_key_ok.rc != 0
  no_log: true

- name: Key must open the Storage Box now
  ansible.builtin.command: "{{ backup_storagebox_ssh_key }} ls"
  delegate_to: localhost
  become: false
  run_once: true
  changed_when: false
  when: backup_sb_key_ok.rc != 0

- name: Install restic
  ansible.builtin.apt:
    name: restic
    state: present

- name: restic config dir
  ansible.builtin.file:
    path: /etc/restic
    state: directory
    mode: "0700"

- name: Deploy Storage Box SSH key
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/secrets/storagebox_ed25519"
    dest: /etc/restic/storagebox_ed25519
    mode: "0600"
  no_log: true

- name: restic password file
  ansible.builtin.copy:
    dest: /etc/restic/password
    content: "{{ backup_key }}\n"
    mode: "0600"
  no_log: true

- name: SSH client config for the Storage Box (port, key, pinned host key — used by restic and by hand)
  ansible.builtin.template:
    src: storagebox-ssh.conf.j2
    dest: /etc/ssh/ssh_config.d/50-storagebox.conf
    mode: "0644"

- name: restic environment
  ansible.builtin.template:
    src: restic.env.j2
    dest: /etc/restic/env
    mode: "0600"

- name: Pin Storage Box host key
  ansible.builtin.shell: ssh-keyscan -p 23 {{ storagebox_host }} > /etc/restic/known_hosts 2>/dev/null
  args:
    creates: /etc/restic/known_hosts

- name: Backup script
  ansible.builtin.template:
    src: k3s-backup.sh.j2
    dest: /usr/local/sbin/k3s-backup
    mode: "0700"

- name: Backup service + timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
  loop:
    - name: k3s-backup.service
      content: |
        [Unit]
        Description=Off-site backup of k3s etcd snapshots and config (restic → Storage Box)
        After=network-online.target
        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/k3s-backup
        Nice=10
        IOSchedulingClass=idle
    - name: k3s-backup.timer
      content: |
        [Unit]
        Description=Daily k3s off-site backup
        [Timer]
        OnCalendar=*-*-* 03:{{ 10 + (groups['k3s_cluster'].index(inventory_hostname) * 10) }}:00
        RandomizedDelaySec=5m
        Persistent=true
        [Install]
        WantedBy=timers.target

- name: Enable backup timer
  ansible.builtin.systemd:
    name: k3s-backup.timer
    enabled: true
    state: started
    daemon_reload: true

- name: Initialise the restic repository (idempotent)
  ansible.builtin.shell: |
    set -a; . /etc/restic/env; set +a
    restic snapshots >/dev/null 2>&1 || restic init
  run_once: true
  changed_when: false
