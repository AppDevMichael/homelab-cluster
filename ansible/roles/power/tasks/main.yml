---
# Lower idle/peak power on the boards. Uses systemd-tmpfiles `w` lines (sysfs writes at boot) — the native way to
# persist sysfs knobs, so there is no unit to maintain. Owner's ask 2026-09-02; measure with a plug meter.
- name: Power tunables (tmpfiles.d)
  ansible.builtin.template:
    src: power.conf.j2
    dest: /etc/tmpfiles.d/power.conf
    mode: "0644"
  notify: Apply tmpfiles

- name: Flush handlers (apply now, same thing the boot does)
  ansible.builtin.meta: flush_handlers

- name: Verify the caps took
  ansible.builtin.command: cat /sys/devices/system/cpu/cpufreq/{{ item.key }}/scaling_max_freq
  loop: "{{ power_cpu_max_khz | dict2items }}"
  loop_control:
    label: "{{ item.key }}={{ item.value }}"
  register: power_caps
  changed_when: false
  failed_when: power_caps.stdout | trim != (item.value | string)
