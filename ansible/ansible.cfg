[defaults]
inventory = inventory/hosts.yml
host_key_checking = False
retry_files_enabled = False
# the community.general "yaml" stdout_callback was removed in v12; use the builtin default callback in yaml mode
callback_result_format = yaml
interpreter_python = auto_silent
forks = 10

[ssh_connection]
# sshpass is needed for the first-boot password login
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
