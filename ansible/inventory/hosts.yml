# ansible_host = the STATIC IP each board should end up on.
# firstboot_ip = the IP it currently has from DHCP on its very first boot (check your router).
#                Remove it after the first run. Omit it if you use DHCP reservations instead.
all:
  vars:
    # The admin user hardening creates. Fresh boards (firstboot_ip set) are contacted as root automatically.
    ansible_user: ops
  children:
    k3s_cluster:
      vars:
        ansible_become: true   # nodes only — localhost-delegated tasks must never sudo on the control machine
      children:
        k3s_init:                 # exactly ONE node bootstraps the etcd cluster
          hosts:
            opi-1:
              ansible_host: 192.168.69.101
              # firstboot_ip: 192.168.68.10
        k3s_servers:              # remaining nodes join as additional servers (HA control plane)
          hosts:
            opi-2:
              ansible_host: 192.168.69.102
              # firstboot_ip: 192.168.68.2
            opi-3:
              ansible_host: 192.168.69.103
              # firstboot_ip: 192.168.68.15
