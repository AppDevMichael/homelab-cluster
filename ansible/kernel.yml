---
# Install / upgrade the custom vendor kernel (kernel/debs/, built by `make kernel`) one node at a time.
# Safe before k3s exists (first bootstrap canary: `-l opi-2`) and after (drains + uncordons).
#   cd ansible && ansible-playbook kernel.yml [-l opi-2]
- name: Rolling custom-kernel install
  hosts: k3s_cluster
  serial: 1
  vars:
    kubectl_node: "{{ groups['k3s_init'][0] }}"
  pre_tasks:
    - name: Is k3s running here?
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/cred
      register: kernel_k3s_present

    - name: Drain node
      ansible.builtin.command: >
        kubectl drain {{ inventory_hostname }} --ignore-daemonsets --delete-emptydir-data --timeout=300s
      delegate_to: "{{ kubectl_node }}"
      changed_when: true
      when: kernel_k3s_present.stat.exists
  roles:
    - kernel
  post_tasks:
    - name: Wait for k3s
      ansible.builtin.wait_for:
        port: 6443
        host: "{{ ansible_host }}"
        timeout: 300
      when: kernel_k3s_present.stat.exists

    - name: Uncordon node
      ansible.builtin.command: kubectl uncordon {{ inventory_hostname }}
      delegate_to: "{{ kubectl_node }}"
      changed_when: true
      when: kernel_k3s_present.stat.exists

    - name: Wait until Ready
      ansible.builtin.command: kubectl get node {{ inventory_hostname }} -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      delegate_to: "{{ kubectl_node }}"
      register: kernel_node_ready
      until: kernel_node_ready.stdout == "True"
      retries: 30
      delay: 10
      changed_when: false
      when: kernel_k3s_present.stat.exists
