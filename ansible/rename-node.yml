---
# Rename a k3s node: k3s node names are immutable, so the node leaves the cluster under its old name and rejoins
# under the new one (hostname, Tailscale name, k3s, restic host tag). One node at a time; run with -l <newname>.
#   1. inventory: rename the host, keep `old_node_name: <old>` on it
#   2. cd ansible && ansible-playbook rename-node.yml -l opi4p-3        (quorum-only node first)
#   3. remove `old_node_name` from the inventory when done
# Data nodes: every volume temporarily gets a 3rd replica on the quorum node so no volume ever runs on one replica.
- name: Rename node (leave under old name, rejoin under new)
  hosts: k3s_cluster
  serial: 1
  vars:
    # any other node: runs kubectl for us and is the join target
    live_server: "{{ (groups['k3s_cluster'] | difference([inventory_hostname])) | first }}"
    quorum_node: >-
      {{ groups['k3s_cluster'] | map('extract', hostvars) | selectattr('k3s_quorum_only', 'defined')
         | map(attribute='inventory_hostname') | first | default('') }}
  tasks:
    - name: Only hosts marked for renaming
      ansible.builtin.meta: end_host
      when: old_node_name is not defined

    # Re-runnable: old present = full run; neither = resume at uninstall; new present = only the tail (uncordon, backup…)
    - name: Is the new name already in the cluster?
      ansible.builtin.command: kubectl get node {{ inventory_hostname }} -o name
      delegate_to: "{{ live_server }}"
      register: rn_new
      failed_when: false
      changed_when: false

    - name: Backup key from the node itself when BACKUP_KEY is unset (agent locked) — the node already holds it
      ansible.builtin.slurp: { src: /etc/restic/password }
      register: rn_key
      no_log: true
      when: backup_key | length == 0
    - name: Use it
      ansible.builtin.set_fact: { backup_key: "{{ rn_key.content | b64decode | trim }}" }
      no_log: true
      when: backup_key | length == 0

    - name: Is the old name still in the cluster? (no = resuming a half-done rename)
      ansible.builtin.command: kubectl get node {{ old_node_name }} -o name
      delegate_to: "{{ live_server }}"
      register: rn_old
      failed_when: false
      changed_when: false

    # --- data nodes: 3rd replica on the quorum node so nothing runs single-replica while this node is out ---
    - name: Open the quorum node to Longhorn replicas for the duration
      ansible.builtin.command: >
        kubectl -n longhorn-system patch nodes.longhorn.io {{ hostvars[quorum_node].old_node_name | default(quorum_node) }}
        --type merge -p '{"spec":{"allowScheduling":true,"evictionRequested":false}}'
      delegate_to: "{{ live_server }}"
      changed_when: true
      when: not (k3s_quorum_only | default(false)) and quorum_node != '' and rn_old.rc == 0

    - name: Ask for 3 replicas on every volume
      ansible.builtin.shell: |
        set -o pipefail
        for v in $(kubectl -n longhorn-system get volumes.longhorn.io -o name); do
          kubectl -n longhorn-system patch $v --type merge -p '{"spec":{"numberOfReplicas":3}}' >/dev/null
        done; echo patched
      args: { executable: /bin/bash }
      delegate_to: "{{ live_server }}"
      changed_when: true
      when: not (k3s_quorum_only | default(false)) and rn_old.rc == 0

    - name: Wait until every volume has 3 healthy replicas
      ansible.builtin.shell: |
        set -o pipefail
        kubectl -n longhorn-system get volumes.longhorn.io,engines.longhorn.io -o json | python3 -c '
        import sys,json
        items=json.load(sys.stdin)["items"]
        # replica modes live on the Engine (status.replicaModeMap), not on the Volume
        rw={e["spec"]["volumeName"]: list((e["status"].get("replicaModeMap") or {}).values()).count("RW")
            for e in items if e["kind"]=="Engine"}
        # detached volumes cannot rebuild; they catch up on next attach
        bad=[v["metadata"]["name"] for v in items if v["kind"]=="Volume" and v["status"].get("state")=="attached"
             and (v["status"].get("robustness")!="healthy" or rw.get(v["metadata"]["name"],0)<3)]
        print("pending:", bad) if bad else print("ok"); sys.exit(1 if bad else 0)'
      args: { executable: /bin/bash }
      delegate_to: "{{ live_server }}"
      register: rn_replicas
      until: rn_replicas.rc == 0
      retries: 60
      delay: 20
      changed_when: false
      when: not (k3s_quorum_only | default(false)) and rn_old.rc == 0

    # --- leave ---
    - name: Drain the old node
      ansible.builtin.command: kubectl drain {{ old_node_name }} --ignore-daemonsets --delete-emptydir-data --timeout=300s
      delegate_to: "{{ live_server }}"
      changed_when: true
      when: rn_old.rc == 0

    - name: Stop k3s
      ansible.builtin.systemd_service:
        name: k3s
        state: stopped
      when: rn_old.rc == 0

    - name: Remove the old node from the cluster (k3s drops its etcd member with it)
      ansible.builtin.command: kubectl delete node {{ old_node_name }} --timeout=120s
      delegate_to: "{{ live_server }}"
      changed_when: true
      when: rn_old.rc == 0

    # Longhorn's webhook only deletes a node that is down, unschedulable and holds no replicas/engines. Ready flips to
    # False (KubernetesNodeGone) shortly after kubectl delete node, hence the retries.
    - name: Delete the replica records left on the old node (they were stopped with k3s; the other copies are healthy)
      ansible.builtin.command: kubectl -n longhorn-system delete replicas.longhorn.io -l longhornnode={{ old_node_name }} --timeout=120s
      delegate_to: "{{ live_server }}"
      changed_when: true

    - name: Disable scheduling on the old Longhorn node record
      ansible.builtin.command: >
        kubectl -n longhorn-system patch nodes.longhorn.io {{ old_node_name }} --type merge -p '{"spec":{"allowScheduling":false}}'
      delegate_to: "{{ live_server }}"
      changed_when: true
      failed_when: false   # already gone on a resume
    - name: Drop the old Longhorn node record (replicas on it are gone with the name)
      ansible.builtin.command: kubectl -n longhorn-system delete nodes.longhorn.io {{ old_node_name }} --ignore-not-found --timeout=120s
      delegate_to: "{{ live_server }}"
      register: rn_lh_del
      until: rn_lh_del.rc == 0
      retries: 18
      delay: 10
      changed_when: true

    # k3s-uninstall.sh refuses to run ("Additional k3s services installed") while k3s-backup.service exists, and it
    # deletes itself even when it bails out early -> detach the backup units first, and finish the cleanup ourselves.
    - name: Detach the restic timer (roles/backup recreates it under the new name)
      ansible.builtin.systemd_service: { name: k3s-backup.timer, state: stopped, enabled: false }
      failed_when: false
      when: rn_new.rc != 0
    - name: Remove the k3s-backup units
      ansible.builtin.file: { path: "/etc/systemd/system/{{ item }}", state: absent }
      loop: [k3s-backup.service, k3s-backup.timer]
      when: rn_new.rc != 0

    - name: Uninstall k3s (data dir included; /var/lib/longhorn is untouched, orphan cleanup handles it)
      ansible.builtin.shell: |
        [ -x /usr/local/bin/k3s-uninstall.sh ] && /usr/local/bin/k3s-uninstall.sh
        rm -rf /etc/rancher/k3s /run/k3s /run/flannel /var/lib/rancher/k3s /var/lib/kubelet \
               /usr/local/bin/k3s /usr/local/bin/k3s-killall.sh /usr/local/bin/k3s-uninstall.sh
        systemctl daemon-reload
      args: { removes: /usr/local/bin/k3s }
      when: rn_new.rc != 0

    # --- rename + rejoin ---
    - name: Hostname
      ansible.builtin.hostname: { name: "{{ inventory_hostname }}" }
    - name: /etc/hosts
      ansible.builtin.lineinfile: { path: /etc/hosts, regexp: '^127\.0\.1\.1', line: "127.0.1.1 {{ inventory_hostname }}" }

    - name: Tailscale name + identity facts
      ansible.builtin.include_role: { name: tailscale }

    - name: Rejoin k3s under the new name (always as a joining server, via a live node)
      ansible.builtin.include_role: { name: k3s }
      vars:
        k3s_role: server
        k3s_join_server: "{{ hostvars[live_server].ansible_host }}"

    - name: Uncordon + Ready
      ansible.builtin.include_role: { name: rolling, tasks_from: resume.yml }
      vars:
        rolling_k3s: { stat: { exists: true } }

    - name: Quorum node — keep Longhorn replicas off it as soon as its node record appears
      ansible.builtin.command: >
        kubectl -n longhorn-system patch nodes.longhorn.io {{ inventory_hostname }} --type merge
        -p '{"spec":{"allowScheduling":false,"evictionRequested":true}}'
      delegate_to: "{{ live_server }}"
      register: rn_lh_quorum
      until: rn_lh_quorum.rc == 0
      retries: 30
      delay: 10
      changed_when: true
      when: k3s_quorum_only | default(false)

    - name: Restic host tag under the new name
      ansible.builtin.include_role: { name: backup }

    # --- data nodes: back to 2 replicas, quorum node closed again (its replicas drain to this node) ---
    - name: Back to 2 replicas per volume
      ansible.builtin.shell: |
        set -o pipefail
        for v in $(kubectl -n longhorn-system get volumes.longhorn.io -o name); do
          kubectl -n longhorn-system patch $v --type merge -p '{"spec":{"numberOfReplicas":2}}' >/dev/null
        done; echo patched
      args: { executable: /bin/bash }
      delegate_to: "{{ live_server }}"
      changed_when: true
      when: not (k3s_quorum_only | default(false))

    - name: Close the quorum node to replicas again
      ansible.builtin.command: >
        kubectl -n longhorn-system patch nodes.longhorn.io {{ hostvars[quorum_node].old_node_name | default(quorum_node) }}
        --type merge -p '{"spec":{"allowScheduling":false,"evictionRequested":true}}'
      delegate_to: "{{ live_server }}"
      changed_when: true
      failed_when: false   # the quorum node itself may have been renamed already; k3s role re-asserts this anyway
      when: not (k3s_quorum_only | default(false)) and quorum_node != ''

    - name: Done
      ansible.builtin.debug:
        msg: "{{ old_node_name }} → {{ inventory_hostname }}: rejoined. Remove old_node_name from the inventory."
