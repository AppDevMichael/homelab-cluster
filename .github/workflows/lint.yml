# Static checks on every PR (incl. Renovate's) and on main. Same tools/pins as locally via mise.
name: lint
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: true
          cache: true
      - name: ansible-lint
        run: cd ansible && ansible-lint site.yml kernel.yml spi-boot.yml upgrade-os.yml
        continue-on-error: true # advisory, as in `make lint` (collections aren't visible to the linter's resolver)
      - name: tofu fmt + validate
        run: cd tofu && tofu fmt -check -recursive && tofu init -backend=false -input=false && tofu validate
      - name: helm lint bootstrap chart
        run: helm lint gitops/bootstrap
      - name: helm template every app with its values (list derived from the bootstrap render)
        run: |
          set -o pipefail
          helm template gitops/bootstrap | python3 -c '
          import sys, yaml
          for a in yaml.safe_load_all(sys.stdin):
              for s in a["spec"].get("sources", []):
                  if "chart" in s:
                      print(a["metadata"]["name"], s["chart"], s["repoURL"], s["targetRevision"],
                            s["helm"]["valueFiles"][0].replace("$values/", ""), a["spec"]["destination"]["namespace"])' |
          while read -r name chart repo ver values ns; do
            case $repo in *://*) src="$chart --repo $repo";; *) src="oci://$repo/$chart";; esac   # OCI charts have no scheme in ArgoCD
            helm template "$name" $src --version "$ver" -f "$values" -n "$ns" >/dev/null && echo "ok $name" || { echo "FAIL $name"; exit 1; }
          done
      - name: kustomize build system-upgrade
        run: kustomize build gitops/system-upgrade >/dev/null
      - name: repo verification sweep
        run: .claude/skills/homelab-iac/scripts/verify-repo.sh
