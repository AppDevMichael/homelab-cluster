# Static checks on every PR (incl. Renovate's) and on main. Same tools/pins as locally via mise.
name: lint
on:
  pull_request:
  push:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - name: ansible-lint
        run: cd ansible && ansible-lint site.yml kernel.yml spi-boot.yml upgrade-os.yml
        continue-on-error: true # advisory, as in `make lint` (collections aren't visible to the linter's resolver)
      - name: tofu fmt + validate
        run: cd tofu && tofu fmt -check -recursive && tofu init -backend=false -input=false && tofu validate
      - name: helm lint bootstrap chart
        run: helm lint gitops/bootstrap
      - name: helm template every app with its values
        run: |
          t() { helm template "$1" "$2" --repo "$3" --version "$4" -f "$5" -n "$6" >/dev/null && echo "ok $1"; }
          t argocd argo-cd https://argoproj.github.io/argo-helm 10.4.2 gitops/argocd/values.yaml argocd
          t longhorn longhorn https://charts.longhorn.io 1.12.0 gitops/longhorn/values.yaml longhorn-system
          t monitoring kube-prometheus-stack https://prometheus-community.github.io/helm-charts 88.3.0 gitops/monitoring/values.yaml monitoring
          t kured kured https://kubereboot.github.io/charts 6.0.0 gitops/kured/values.yaml kured
          t tailscale tailscale-operator https://pkgs.tailscale.com/helmcharts 1.102.3 gitops/tailscale/values.yaml tailscale
      - name: kustomize build system-upgrade
        run: kustomize build gitops/system-upgrade >/dev/null
      - name: repo verification sweep
        run: .claude/skills/homelab-iac/scripts/verify-repo.sh
