# Self-hosted Renovate: same engine and config (renovate.json) as the hosted app, but runs here under a token
# the owner controls — no third-party GitHub App. PRs it opens are validated by lint.yml.
# Needs a fine-grained PAT in the repo secret RENOVATE_TOKEN (this repo only: Contents RW, Pull requests RW,
# Issues RW, Workflows RW, Metadata R). GITHUB_TOKEN would work too but PRs made with it don't trigger CI.
name: renovate
on:
  schedule:
    - cron: "17 6 * * *" # daily 06:17 UTC
  workflow_dispatch:
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: renovatebot/github-action@v46.3.1
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          renovate-version: 44.93.4
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_ONBOARDING: "false"     # renovate.json is already in the repo
          RENOVATE_REQUIRE_CONFIG: required
          LOG_LEVEL: info
